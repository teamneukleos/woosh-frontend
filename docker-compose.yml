services:
  postgres:
    image: postgres:16-alpine
    container_name: woosh-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: woosh
    ports:
      - "5433:5432"
    volumes:
      - woosh_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d woosh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  woosh_pg_data:
